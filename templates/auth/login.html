{% extends "base.html" %}

{% block title %}登录 - 餐厅点餐系统{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-5 col-md-7">
        <div class="card shadow-lg border-0">
            <div class="card-header bg-primary text-white text-center py-4">
                <i class="bi bi-box-arrow-in-right display-5"></i>
                <h3 class="mt-2 mb-0">用户登录</h3>
            </div>
            <div class="card-body p-5">
                <form method="POST" action="{{ url_for('auth.login') }}" id="loginForm">
                    <div class="mb-4">
                        <label for="username" class="form-label">
                            <i class="bi bi-person"></i> 用户名
                        </label>
                        <input type="text" class="form-control form-control-lg"
                               id="username" name="username"
                               placeholder="请输入用户名"
                               autocomplete="username"
                               required autofocus>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label">
                            <i class="bi bi-lock"></i> 密码
                        </label>
                        <input type="password" class="form-control form-control-lg"
                               id="password" name="password"
                               placeholder="请输入密码"
                               autocomplete="current-password"
                               required>
                    </div>

                    <div class="mb-4 form-check">
                        <input type="checkbox" class="form-check-input"
                               id="remember" name="remember">
                        <label class="form-check-label" for="remember">
                            记住我
                        </label>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg" id="loginBtn">
                            <i class="bi bi-box-arrow-in-right"></i> 登录
                        </button>
                    </div>
                </form>
            </div>
            <div class="card-footer text-center py-3 bg-light">
                <p class="mb-0">
                    还没有账号？
                    <a href="{{ url_for('auth.register') }}" class="text-decoration-none">
                        立即注册
                    </a>
                </p>
            </div>
        </div>

        <div class="alert alert-info mt-4" role="alert">
            <i class="bi bi-info-circle"></i>
            <strong>测试账号：</strong>
            <ul class="mb-0 mt-2">
                <li>管理员：admin / 123456</li>
                <li>顾客：user001 / 123456</li>
            </ul>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
// 表单提交处理
document.getElementById('loginForm').addEventListener('submit', function(e) {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    if (!username || !password) {
        e.preventDefault();
        alert('请输入用户名和密码');
        return false;
    }

    // 显示加载状态
    const btn = document.getElementById('loginBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>登录中...';
});
</script>
{% endblock %}
