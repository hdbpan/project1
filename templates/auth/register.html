{% extends "base.html" %}

{% block title %}注册 - 餐厅点餐系统{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6 col-md-8">
        <div class="card shadow-lg border-0">
            <div class="card-header bg-success text-white text-center py-4">
                <i class="bi bi-person-plus display-5"></i>
                <h3 class="mt-2 mb-0">用户注册</h3>
            </div>
            <div class="card-body p-5">
                <form method="POST" action="{{ url_for('auth.register') }}" id="registerForm">
                    <div class="mb-3">
                        <label for="username" class="form-label">
                            <i class="bi bi-person"></i> 用户名 <span class="text-danger">*</span>
                        </label>
                        <input type="text" class="form-control" id="username" 
                               name="username" placeholder="3-20个字符" 
                               minlength="3" maxlength="20" required autofocus>
                        <div class="form-text">用户名将用于登录</div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="phone" class="form-label">
                            <i class="bi bi-phone"></i> 手机号 <span class="text-danger">*</span>
                        </label>
                        <input type="tel" class="form-control" id="phone" 
                               name="phone" placeholder="11位手机号" 
                               pattern="[0-9]{11}" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="password" class="form-label">
                            <i class="bi bi-lock"></i> 密码 <span class="text-danger">*</span>
                        </label>
                        <input type="password" class="form-control" id="password" 
                               name="password" placeholder="至少6个字符" 
                               minlength="6" required>
                    </div>
                    
                    <div class="mb-4">
                        <label for="confirm_password" class="form-label">
                            <i class="bi bi-lock-fill"></i> 确认密码 <span class="text-danger">*</span>
                        </label>
                        <input type="password" class="form-control" id="confirm_password" 
                               name="confirm_password" placeholder="再次输入密码" required>
                        <div class="invalid-feedback">两次密码不一致</div>
                    </div>
                    
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-success btn-lg">
                            <i class="bi bi-person-plus"></i> 注册
                        </button>
                        <a href="{{ url_for('auth.login') }}" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left"></i> 返回登录
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
// 密码确认验证
document.getElementById('registerForm').addEventListener('submit', function(e) {
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirm_password').value;
    
    if (password !== confirmPassword) {
        e.preventDefault();
        document.getElementById('confirm_password').classList.add('is-invalid');
        return false;
    }
});

// 清除错误提示
document.getElementById('confirm_password').addEventListener('input', function() {
    this.classList.remove('is-invalid');
});
</script>
{% endblock %}
